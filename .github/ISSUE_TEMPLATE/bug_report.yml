name: Bug report
description: Something in Yume does not work the way the docs say it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. For a security problem, do not use this form: follow the [security policy](https://github.com/yumejp/yume/security/policy) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Dictionary and search for 猫
        2. Select Add to deck
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Yume version
      description: The server version in Settings › About, or the `version` field of `/health`. If you built from source, add the commit.
      placeholder: 0.0.1, main at abc1234
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Device and browser
      description: Where you use the app, and the system the server runs on.
      placeholder: iPhone 15, Safari home-screen app; server on a Raspberry Pi 4
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How the server is installed
      options:
        - Docker Compose from this repository
        - A published Docker image
        - Built from source
        - Raspberry Pi or other systemd service
        - Other (say below)
    validations:
      required: true
  - type: dropdown
    id: server-mode
    attributes:
      label: Server mode
      description: How the server is reached and whether it asks for sign-in (YUME_AUTH_MODE).
      options:
        - This computer only (127.0.0.1), open mode
        - Private network such as Tailscale, open mode
        - Sign-in required (YUME_AUTH_MODE=required)
        - Not sure
    validations:
      required: true
  - type: input
    id: tutor
    attributes:
      label: AI tutor
      description: The assistant connected over MCP, if the problem involves it.
      placeholder: Claude Code, Codex CLI, none
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here. A screenshot of the screen that went wrong helps most.
  - type: textarea
    id: logs
    attributes:
      label: Server log
      description: The lines the server printed around the problem, if any.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I removed session tokens, passwords, private addresses and deck contents I do not want public from the text, logs and screenshots.
          required: true
